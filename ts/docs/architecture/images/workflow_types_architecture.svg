<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 310"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Provider-owned workflow execution</title>
  <desc id="desc">
    Grammar and typed actions route to PowerShell, WebFlow or TaskFlow. Each
    provider retains its own execution and authorization rules. This diagram
    doesn't cover the checked-program macro runtime.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path
        d="M1 1 L9 5 L1 9"
        fill="none"
        stroke="#495057"
        stroke-width="1.5"
      />
    </marker>
  </defs>
  <rect width="900" height="310" rx="12" fill="#fff" />
  <g font-family="Segoe UI, sans-serif" text-anchor="middle" fill="#212529">
    <rect
      x="290"
      y="20"
      width="320"
      height="56"
      rx="10"
      fill="#e7f5ff"
      stroke="#1971c2"
    />
    <text x="450" y="54" font-size="20">Grammar / typed action</text>
    <g stroke="#495057" fill="none" marker-end="url(#arrow)">
      <path d="M450 76 V98 H155 V122" />
      <path d="M450 76 V122" />
      <path d="M450 76 V98 H745 V122" />
    </g>
    <g fill="#f8f9fa" stroke="#868e96">
      <rect x="20" y="130" width="270" height="155" rx="10" />
      <rect x="315" y="130" width="270" height="155" rx="10" />
      <rect x="610" y="130" width="270" height="155" rx="10" />
    </g>
    <g font-size="22">
      <text x="155" y="167">PowerShell</text>
      <text x="450" y="167">WebFlow</text>
      <text x="745" y="167">TaskFlow</text>
    </g>
    <g font-size="18">
      <text x="155" y="205">Exact script authorization</text>
      <text x="155" y="232">Approved-local broker</text>
      <text x="155" y="259">Current-user OS rights</text>
      <text x="450" y="205">Static checks / frozen API</text>
      <text x="450" y="232">Node Function, WebUtils</text>
      <text x="450" y="259">Browser operations</text>
      <text x="745" y="205">Static checks / frozen API</text>
      <text x="745" y="232">Node Function, TaskFlow API</text>
      <text x="745" y="259">Dispatcher actions</text>
    </g>
  </g>
</svg>
