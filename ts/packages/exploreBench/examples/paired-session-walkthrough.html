    (() =&gt; {
      const root = document.getElementById("paired-session-walkthrough");
      const buttons = [...root.querySelectorAll("[data-step-button]")];
      const panels = [...root.querySelectorAll("[data-step-panel]")];
      const previous = root.querySelector("#psw-prev");
      const next = root.querySelector("#psw-next");
      const progress = root.querySelector("#psw-progress");
      const label = root.querySelector("#psw-step-label");
      const jsonl = JSON.parse(root.querySelector("#psw-jsonl-data").textContent);
      const labels = [
        "Recorded setup · astropy__astropy-12907 · azure/gpt-5.6-luna",
        "Prompt provenance · captured runtime values versus source-template excerpts",
        "Native Copilot JSONL · every object rendered · nested TypeAgent trace",
        "Chronological outer-agent route",
        "Repository inspection calls",
        "Returned citations and localization recall",
        "Token accounting and integrity gates"
      ];
      let current = 0;

      function createJsonEntry(event, identity, nested = false) {
        const details = document.createElement("details");
        details.className = nested ? "psw-json-entry psw-json-inner" : "psw-json-entry";
        details.dataset.traceEntry = identity;
        details.dataset.eventType = event.type;
        details.dataset.eventKind = event.kind;
        const haystack = [
          identity,
          event.type,
          event.kind,
          event.summary,
          JSON.stringify(event.raw)
        ]
          .join(" ")
          .toLowerCase();
        details.dataset.search = haystack;

        const summaryEl = document.createElement("summary");
        summaryEl.className = "psw-json-entry-head";
        const headMain = document.createElement("div");
        headMain.className = "psw-json-entry-headmain";
        const title = document.createElement("span");
        title.className = "psw-json-entry-id";
        title.textContent = identity;
        const type = document.createElement("code");
        type.textContent = event.type;
        const summaryText = document.createElement("span");
        summaryText.className = "psw-json-entry-summary";
        summaryText.textContent = event.summary;
        headMain.append(title, type, summaryText);
        const kind = document.createElement("span");
        kind.className = "viz-badge";
        kind.textContent = event.kind[0].toUpperCase() + event.kind.slice(1);
        summaryEl.append(headMain, kind);

        const metadata = document.createElement("div");
        metadata.className = "text-small text-muted psw-json-metadata";
        const timestamp = document.createElement("span");
        timestamp.textContent = event.timestamp;
        metadata.append(timestamp);

        const pre = document.createElement("pre");
        pre.className = "psw-json-pre";
        pre.appendChild(renderJsonValue(event.raw, 0));
        details.append(summaryEl, metadata, pre);
        return details;
      }

      function renderJsonValue(value, indent) {
        const frag = document.createDocumentFragment();
        if (value === null) {
          const span = document.createElement("span");
          span.className = "psw-json-null";
          span.textContent = "null";
          frag.appendChild(span);
          return frag;
        }
        const kind = typeof value;
        if (kind === "string") {
          frag.appendChild(renderJsonString(value, indent));
          return frag;
        }
        if (kind === "number" || kind === "boolean") {
          const span = document.createElement("span");
          span.className = kind === "number" ? "psw-json-num" : "psw-json-bool";
          span.textContent = String(value);
          frag.appendChild(span);
          return frag;
        }
        if (Array.isArray(value)) {
          if (value.length === 0) {
            frag.append(punct("[]"));
            return frag;
          }
          frag.append(punct("["), document.createTextNode("\n"));
          const pad = "  ".repeat(indent + 1);
          value.forEach((item, i) =&gt; {
            frag.append(document.createTextNode(pad));
            frag.append(renderJsonValue(item, indent + 1));
            if (i &lt; value.length - 1) frag.append(punct(","));
            frag.append(document.createTextNode("\n"));
          });
          frag.append(document.createTextNode("  ".repeat(indent)), punct("]"));
          return frag;
        }
        // object
        const keys = Object.keys(value);
        if (keys.length === 0) {
          frag.append(punct("{}"));
          return frag;
        }
        frag.append(punct("{"), document.createTextNode("\n"));
        const pad = "  ".repeat(indent + 1);
        keys.forEach((key, i) =&gt; {
          frag.append(document.createTextNode(pad));
          const keySpan = document.createElement("span");
          keySpan.className = "psw-json-key";
          keySpan.textContent = JSON.stringify(key);
          frag.append(keySpan, punct(": "));
          frag.append(renderJsonValue(value[key], indent + 1));
          if (i &lt; keys.length - 1) frag.append(punct(","));
          frag.append(document.createTextNode("\n"));
        });
        frag.append(document.createTextNode("  ".repeat(indent)), punct("}"));
        return frag;
      }

      function punct(text) {
        const span = document.createElement("span");
        span.className = "psw-json-punct";
        span.textContent = text;
        return span;
      }

      function renderJsonString(value, indent) {
        // Multiline strings: render as a bordered block preserving spacing.
        if (value.includes("\n")) {
          const block = document.createElement("span");
          block.className = "psw-json-multiline";
          block.style.setProperty("--psw-json-indent", `${indent * 2}ch`);
          const label = document.createElement("span");
          label.className = "psw-json-multiline-label";
          const lines = value.split("\n").length;
          label.textContent = `❝ ${lines} lines`;
          const body = document.createElement("span");
          body.className = "psw-json-multiline-body";
          body.textContent = value;
          block.append(label, body);
          return block;
        }
        const span = document.createElement("span");
        span.className = "psw-json-str";
        span.textContent = JSON.stringify(value);
        return span;
      }

      function createNestedTrace(nestedTrace) {
        const section = document.createElement("section");
        section.className = "psw-nested-trace";
        section.dataset.nestedParentLine = String(nestedTrace.parentOuterLine);
        const head = document.createElement("div");
        head.className = "psw-nested-head";
        const title = document.createElement("div");
        title.textContent = nestedTrace.label;
        const count = document.createElement("span");
        count.className = "viz-badge";
        count.textContent = `${nestedTrace.events.length} events · ${nestedTrace.totalTokens.toLocaleString("en-US")} tokens`;
        head.append(title, count);
        const source = document.createElement("p");
        source.className = "text-small text-muted";
        source.textContent = nestedTrace.source;
        section.append(head, source);
        nestedTrace.events.forEach((event) =&gt; {
          section.appendChild(createJsonEntry(event, `Inner ${event.index}`, true));
        });
        return section;
      }

      function buildJsonControls(sessionKey, controlsId, scrollId) {
        const session = jsonl[sessionKey];
        const controls = root.querySelector(controlsId);
        const scroll = root.querySelector(scrollId);
        if (!controls || !scroll) return;

        const kinds = new Set();
        session.events.forEach((event) =&gt; kinds.add(event.kind));
        if (session.nestedTrace) {
          session.nestedTrace.events.forEach((event) =&gt; kinds.add(event.kind));
        }

        const search = document.createElement("input");
        search.type = "search";
        search.className = "form-control psw-json-search";
        search.placeholder = "Filter events by text, type, or JSON…";
        search.setAttribute("aria-label", "Filter JSONL events");

        const filterRow = document.createElement("div");
        filterRow.className = "psw-json-filter-row";

        const kindSelect = document.createElement("select");
        kindSelect.className = "form-select psw-json-kind";
        kindSelect.setAttribute("aria-label", "Filter by event kind");
        const allOption = document.createElement("option");
        allOption.value = "";
        allOption.textContent = "All kinds";
        kindSelect.appendChild(allOption);
        [...kinds].sort().forEach((k) =&gt; {
          const option = document.createElement("option");
          option.value = k;
          option.textContent = k[0].toUpperCase() + k.slice(1);
          kindSelect.appendChild(option);
        });

        const expandBtn = document.createElement("button");
        expandBtn.type = "button";
        expandBtn.className = "btn btn-ghost";
        expandBtn.textContent = "Expand all";
        const collapseBtn = document.createElement("button");
        collapseBtn.type = "button";
        collapseBtn.className = "btn btn-ghost";
        collapseBtn.textContent = "Collapse all";

        const countLabel = document.createElement("span");
        countLabel.className = "text-small text-muted psw-json-count";

        filterRow.append(kindSelect, expandBtn, collapseBtn, countLabel);
        controls.append(search, filterRow);

        function applyFilter() {
          const term = search.value.trim().toLowerCase();
          const kind = kindSelect.value;
          let shown = 0;
          let total = 0;
          scroll.querySelectorAll(".psw-json-entry").forEach((entry) =&gt; {
            total += 1;
            const matchesKind = !kind || entry.dataset.eventKind === kind;
            const matchesTerm = !term || (entry.dataset.search || "").includes(term);
            const visible = matchesKind &amp;&amp; matchesTerm;
            entry.hidden = !visible;
            if (visible) shown += 1;
          });
          scroll.querySelectorAll(".psw-nested-trace").forEach((trace) =&gt; {
            const anyVisible = [...trace.querySelectorAll(".psw-json-entry")].some(
              (entry) =&gt; !entry.hidden
            );
            trace.hidden = !anyVisible;
          });
          countLabel.textContent = `${shown} / ${total} shown`;
        }

        search.addEventListener("input", applyFilter);
        kindSelect.addEventListener("change", applyFilter);
        expandBtn.addEventListener("click", () =&gt; {
          scroll
            .querySelectorAll(".psw-json-entry:not([hidden])")
            .forEach((entry) =&gt; entry.open = true);
        });
        collapseBtn.addEventListener("click", () =&gt; {
          scroll
            .querySelectorAll(".psw-json-entry")
            .forEach((entry) =&gt; entry.open = false);
        });
        applyFilter();
      }

      function renderJsonSession(sessionKey, targetId) {
        const session = jsonl[sessionKey];
        const target = root.querySelector(targetId);
        session.events.forEach((event) =&gt; {
          target.appendChild(createJsonEntry(event, `Line ${event.line}`));
          if (
            session.nestedTrace &amp;&amp;
            event.line === session.nestedTrace.parentOuterLine
          ) {
            target.appendChild(createNestedTrace(session.nestedTrace));
          }
        });
      }

      renderJsonSession("baseline", "#psw-json-baseline");
      renderJsonSession("mcp", "#psw-json-mcp");
      buildJsonControls("baseline", "#psw-json-controls-baseline", "#psw-json-baseline");
      buildJsonControls("mcp", "#psw-json-controls-mcp", "#psw-json-mcp");

      function selectStep(index) {
        current = Math.max(0, Math.min(panels.length - 1, index));
        buttons.forEach((button, buttonIndex) =&gt; {
          button.setAttribute("aria-pressed", String(buttonIndex === current));
        });
        panels.forEach((panel, panelIndex) =&gt; {
          panel.hidden = panelIndex !== current;
        });
        previous.disabled = current === 0;
        next.disabled = current === panels.length - 1;
        next.textContent = current === panels.length - 1 ? "Complete" : "Next";
        progress.textContent = `Step ${current + 1} of ${panels.length}`;
        label.textContent = labels[current];
      }

      buttons.forEach((button, index) =&gt; button.addEventListener("click", () =&gt; selectStep(index)));
      previous.addEventListener("click", () =&gt; selectStep(current - 1));
      next.addEventListener("click", () =&gt; {
        if (current &lt; panels.length - 1) selectStep(current + 1);
      });
      selectStep(0);
    })();

&lt;script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"&gt;&lt;/script&gt;
&lt;script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
