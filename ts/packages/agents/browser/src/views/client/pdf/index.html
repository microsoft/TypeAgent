<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="google" content="notranslate" />
    <title>PDF Viewer - TypeAgent</title>

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="toolbar">
        <div class="toolbar-left">
          <button
            id="openLocalPdf"
            type="button"
            title="Open local PDF"
            aria-label="Open local PDF"
          >
            <i class="fas fa-folder-open" aria-hidden="true"></i>
          </button>
          <input
            id="localPdfFile"
            type="file"
            accept="application/pdf,.pdf"
            hidden
          />
          <button
            id="inspectPdf"
            type="button"
            title="Inspect PDF"
            aria-label="Inspect PDF"
            aria-expanded="false"
            aria-controls="pdfInspection"
          >
            <i class="fas fa-file-pen" aria-hidden="true"></i>
          </button>
          <button
            id="saveToCorpus"
            type="button"
            title="Save to corpus"
            aria-label="Save to corpus"
            hidden
          >
            <i class="fas fa-file-import" aria-hidden="true"></i>
          </button>
        </div>

        <div class="toolbar-center" hidden>
          <div class="page-controls">
            <button id="prevPage" title="Previous page">
              <i class="fas fa-chevron-left"></i>
            </button>
            <input
              type="number"
              id="pageNum"
              class="page-input"
              value="1"
              min="1"
            />
            <span class="page-separator">of</span>
            <span id="pageCount" class="page-total">-</span>
            <button id="nextPage" title="Next page">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="toolbar-right" hidden>
          <button id="clippingTool" title="Take screenshot clipping">
            <i class="fas fa-crop"></i>
          </button>
          <button id="zoomOut" title="Zoom out">
            <i class="fas fa-minus"></i>
          </button>
          <span id="scale" class="zoom-level">100%</span>
          <button id="zoomIn" title="Zoom in">
            <i class="fas fa-plus"></i>
          </button>
        </div>
      </div>

      <div class="viewer-container" id="viewerContainer">
        <div class="loading">Loading PDF viewer...</div>
      </div>
      <aside
        id="pdfInspection"
        class="pdf-inspection"
        aria-label="PDF inspection"
        hidden
      >
        <div class="inspection-actions">
          <button
            id="extractPdf"
            title="Extract text"
            aria-label="Extract text"
          >
            <i class="fas fa-file-lines" aria-hidden="true"></i>
          </button>
          <button
            id="pauseInspection"
            hidden
            title="Pause or resume"
            aria-label="Pause or resume"
          >
            <i class="fas fa-pause" aria-hidden="true"></i>
          </button>
          <button
            id="cancelInspection"
            hidden
            title="Cancel extraction"
            aria-label="Cancel extraction"
          >
            <i class="fas fa-stop" aria-hidden="true"></i>
          </button>
          <button
            id="downloadPdfMarkdown"
            hidden
            title="Download Markdown"
            aria-label="Download Markdown"
          >
            <i class="fab fa-markdown" aria-hidden="true"></i>
          </button>
        </div>
        <p id="inspectionStatus" role="status" aria-live="polite">
          No PDF loaded
        </p>
        <section id="inspectionWarningsGroup" hidden>
          <h2>Warnings</h2>
          <pre id="inspectionWarnings"></pre>
        </section>
        <section data-inspection-content hidden>
          <h2>Markdown</h2>
          <div id="inspectionPreview"></div>
        </section>
      </aside>
    </div>

    <!-- TypeAgent PDF Viewer Scripts -->
    <script type="module" src="app.ts"></script>
  </body>
</html>
