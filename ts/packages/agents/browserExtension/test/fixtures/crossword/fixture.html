<html lang="en">

    <title>Wordwork | Crossword 2</title>
    <link rel="stylesheet" href="/exolve-m.css" />
    <script src="/exolve-m.js"></script>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        color: #202923;
        background: #f7f9f8;
        font-family: Georgia, serif;
      }
      header {
        border-bottom: 1px solid #becdc8;

        justify-content: space-between;
        align-items: center;

      }
      header strong {

      header span {

      }
      .xlv-frame {

      .xlv-title {
        font-size: 28px;
      }

        header {
          padding: 14px;
          flex-wrap: wrap;
        }
        main {

          box-sizing: border-box;
