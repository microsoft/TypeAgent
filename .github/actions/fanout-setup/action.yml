name: Prepare a fan-out runner
description: Install the pinned tools and runner-local native dependencies
inputs:
  node-version:
    required: true
    description: Exact Node.js version
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: pwsh
      run: |
        sudo apt-get update
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        sudo apt-get install -y libsecret-1-dev
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ts/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ts/pnpm-lock.yaml
    - name: Install native dependencies with bounded visible retries
      shell: pwsh
      working-directory: ts
      run: |
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          $retryArgs = @()
          if ($attempt -gt 1) { $retryArgs = @('--force') }
          pnpm install --frozen-lockfile --strict-peer-dependencies @retryArgs
          $status = $LASTEXITCODE
          if ($status -eq 0) { exit 0 }
          if ($attempt -eq 3) { throw "Dependency installation exhausted 3 attempts; last exit code $status." }
          Write-Output "::warning::Dependency installation attempt $attempt failed (exit $status). Retrying with a forced reimport and native rebuild."
          Start-Sleep -Seconds (5 * $attempt)
        }
