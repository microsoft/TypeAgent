name: Build/test fan-out qualification

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ts
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y libsecret-1-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install native dependencies for this runner
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Build memory service and its dependencies once
        run: npm exec --no -- fluid-build "^@typeagent/memory-service$" -t build --dep
      - name: Discover tests and fingerprint compiled outputs
        run: node tools/scripts/ciFanoutExperiment.mjs create
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fanout-build-${{ matrix.os }}-node24-${{ github.sha }}
          path: |
            ts/**/dist/**
            !ts/**/node_modules/**
            ts/ci-fanout-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: ["1", "2", "3", "4", control]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
        working-directory: ts
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y libsecret-1-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install native dependencies for this runner
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fanout-build-${{ matrix.os }}-node24-${{ github.sha }}
          path: ts
      - name: Verify and test downloaded outputs without rebuilding
        run: node tools/scripts/ciFanoutExperiment.mjs test ${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fanout-result-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/fanout-results/*
          if-no-files-found: error
          retention-days: 7

  qualification:
    if: always()
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fanout-result-*
          path: ${{ runner.temp }}/fanout-results
          merge-multiple: true
      - name: Compare inventories, outcomes and test-process timings
        working-directory: ts
        run: node tools/scripts/ciFanoutExperiment.mjs aggregate
      - name: Reject failed, cancelled or skipped work
        if: ${{ needs.build.result != 'success' || needs.test.result != 'success' }}
        run: throw "Build or test matrix did not succeed."
        shell: pwsh
