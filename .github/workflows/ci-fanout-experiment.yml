name: Sharded TypeScript CI

on:
  workflow_call:
    inputs:
      node_set:
        type: string
        default: "all"
      include_controls:
        type: boolean
        default: false
      build_cache:
        type: boolean
        default: false
      native_cache:
        type: boolean
        default: false
      compact_artifact:
        type: boolean
        default: false
      artifact_compression:
        type: string
        default: "6"

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/fanout-setup
        with:
          node-version: "24.22.1"
          native-cache: ${{ inputs.native_cache }}
      - name: Check platform-independent formatting and lint once
        working-directory: ts
        shell: pwsh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
        run: |
          if ($env:CI_EVENT_NAME -eq 'pull_request') {
            git fetch --no-tags origin $env:CI_BASE_REF
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tools/scripts/prettier-changed.mjs --base "origin/$env:CI_BASE_REF"
          } else {
            npm run lint
          }
          exit $LASTEXITCODE
      - name: Complexity ratchet
        if: github.event_name == 'pull_request'
        working-directory: ts
        shell: pwsh
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: npm run code-complexity -- --ratchet --base "origin/$env:CI_BASE_REF" --cyclomatic 25 --cognitive 30 --new-file-cyclomatic 25 --new-file-cognitive 30
      - name: Lint ratchet
        if: github.event_name == 'pull_request'
        working-directory: ts
        shell: pwsh
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: npm run code-lint -- --ratchet --base "origin/$env:CI_BASE_REF"
      - name: Circular dependency ratchet
        if: github.event_name == 'pull_request'
        working-directory: ts
        shell: pwsh
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: npm run code-circular -- --ratchet --base "origin/$env:CI_BASE_REF" --exceptions-file tools/scripts/code/circular-baseline-exception.json
      - name: Test debt gate
        if: github.event_name == 'pull_request'
        working-directory: ts
        shell: pwsh
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: npm run code-debt -- --gate --base "origin/$env:CI_BASE_REF"

  targets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ${{ inputs.node_set == '24-and-26' && fromJSON('["24.22.1","26.12.1"]') || fromJSON('["22.23.4","24.22.1","26.12.1"]') }}
    uses: ./.github/workflows/ci-fanout-target.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      include_controls: ${{ inputs.include_controls }}
      build_cache: ${{ inputs.build_cache }}
      native_cache: ${{ inputs.native_cache }}
      compact_artifact: ${{ inputs.compact_artifact }}
      artifact_compression: ${{ inputs.artifact_compression }}

  qualification:
    if: always()
    needs: [analysis, targets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TYPEAGENT_FANOUT_NODE_SET: ${{ inputs.node_set }}
      TYPEAGENT_FANOUT_INCLUDE_CONTROLS: ${{ inputs.include_controls }}
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Reject failed, cancelled or skipped work
        if: ${{ needs.analysis.result != 'success' || needs.targets.result != 'success' }}
        shell: pwsh
        working-directory: .
        run: throw "Analysis or a supported target did not succeed. Inspect the failed job before comparing results."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fanout-result-*
          path: ${{ runner.temp }}/fanout-results
          merge-multiple: true
      - name: Qualify selected memory shard inventories and optional control comparisons
        run: pnpm run ci:node tools/scripts/ciFanoutExperiment.mjs aggregate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fanout-partition-*
          path: ${{ runner.temp }}/fanout-partitions
          merge-multiple: true
      - name: Require exact dispatcher and provider partition coverage
        run: pnpm run ci:node tools/scripts/ciPackagePartitions.mjs aggregate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fanout-lane-*
          path: ${{ runner.temp }}/fanout-lanes
          merge-multiple: true
      - name: Require exact remainder package and script coverage
        run: pnpm run ci:node tools/scripts/ciWorkspaceLanes.mjs aggregate
