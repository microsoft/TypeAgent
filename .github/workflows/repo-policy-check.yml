name: repo-policy-check

on:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-submodules:
    name: Repo Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "false"
          # token: ${{ secrets.PAT_TOKEN }}
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          package_json_file: ts/package.json
      # Match other TS workflows: pin Node and cache the pnpm store so this
      # lightweight policy job does not re-download the full monorepo on every run.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ts
        env:
          # Large native tarballs (copilot, claude-agent-sdk, onnxruntime,
          # app-builder-bin) occasionally stall on the public registry and abort
          # the whole install (merge_group job 90699021484). Give downloads more
          # time/retries than pnpm's defaults.
          npm_config_fetch_timeout: "600000"
          npm_config_fetch_retries: "5"
        run: |
          # pnpm-workspace.yaml lists both x64 and arm64 so local installs work
          # on Apple Silicon and Intel. That forces every CI install to also pull
          # arm64 native packages on ubuntu-latest, which is wasted work for this
          # job and has timed out under registry pressure. Restrict to the runner.
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "pnpm-workspace.yaml";
            const src = fs.readFileSync(path, "utf8");
            const dst = src.replace(
              /supportedArchitectures:\n  cpu:\n    - x64\n    - arm64\n/,
              "supportedArchitectures:\n  os:\n    - linux\n  cpu:\n    - x64\n  libc:\n    - glibc\n",
            );
            if (dst === src) {
              throw new Error(
                "failed to patch supportedArchitectures for CI install",
              );
            }
            fs.writeFileSync(path, dst);
          '
          pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Check Repo Policy
        run: |
          node ts/tools/scripts/repo-policy-check.mjs
      - name: Check Submodule
        if: false # This step is disabled and will be skipped
        run: |
          echo GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME
          echo GITHUB_BASE_REF: $GITHUB_BASE_REF
          echo GITHUB_REF: $GITHUB_REF
          echo GITHUB_SHA: $GITHUB_SHA

          if [ "$GITHUB_EVENT_NAME" == "merge_group" ]; then
            BASE_REF=$(echo $GITHUB_REF | cut -d/ -f4)
          else
            BASE_REF=$GITHUB_BASE_REF
          fi

          echo BASE_REF: $BASE_REF          
          git fetch origin $BASE_REF --recurse-submodules=no

          SUBMODULE_PATH=ts/packages/dispatcher/test/repo
          SUBMODULE_TARGET_SHA=`git ls-tree --object-only $GITHUB_SHA $SUBMODULE_PATH`
          echo "Target: $GITHUB_SHA Submodule: $SUBMODULE_TARGET_SHA"          
          BASE_SHA=`git show-ref refs/remotes/origin/$BASE_REF --hash`
          SUBMODULE_BASE_SHA=`git ls-tree --object-only $BASE_SHA $SUBMODULE_PATH`
          echo "Base: $BASE_REF $BASE_SHA Submodule: $SUBMODULE_BASE_SHA"

          if [ "$SUBMODULE_TARGET_SHA" == "$SUBMODULE_BASE_SHA" ]; then
            exit 0
          fi

          cd $SUBMODULE_PATH
          git fetch origin $SUBMODULE_BASE_SHA
          git fetch origin $SUBMODULE_TARGET_SHA --depth 50
          echo "Checking git merge-base --is-ancestor $SUBMODULE_BASE_SHA $SUBMODULE_TARGET_SHA"
          git merge-base --is-ancestor $SUBMODULE_BASE_SHA $SUBMODULE_TARGET_SHA
