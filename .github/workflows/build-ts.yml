# This workflow will build and test the TypeAgent TypeScript code

name: build-ts

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read
  id-token: write

env:
  NODE_OPTIONS: --max_old_space_size=8192
  # Fast lane (see the "Determine CI scope" step): a PR whose affected
  # packages don't need the full pipeline runs on this single matrix leg.
  FAST_LANE_OS: ubuntu-latest
  FAST_LANE_NODE: 22

jobs:
  build_ts:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        version: [22, 24]

    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
      - name: Setup Git LF
        run: |
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the changed-files lint can diff against the base.
          fetch-depth: 0
      # Decide how much CI this change needs (tools/scripts/ciScope.mjs):
      #   skip - nothing under ts/ (or this workflow) changed
      #   fast - every ts/ change is inside the hardcoded FAST_PACKAGES list
      #          (git-story, the Copilot plugins); one FAST_LANE_OS/
      #          FAST_LANE_NODE leg installs, builds and tests only those
      #          packages; the other legs skip and report success.
      #   full - anything else.
      # Only pull requests are scoped; merge queue, push to main and manual
      # runs are always full, which backstops the fast lane.  A scope failure
      # also falls back to full.
      - name: Determine CI scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          LEG_OS: ${{ matrix.os }}
          LEG_NODE: ${{ matrix.version }}
        working-directory: ts
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags origin "$BASE_REF" || true
            node tools/scripts/ciScope.mjs --base "origin/$BASE_REF" --full-trigger .github/workflows/build-ts.yml || echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
          mode=$(grep '^mode=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          run=true
          if [ "$mode" = skip ]; then run=false; fi
          if [ "$mode" = fast ] && [ "$LEG_OS/$LEG_NODE" != "$FAST_LANE_OS/$FAST_LANE_NODE" ]; then run=false; fi
          echo "Run on this leg: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ steps.scope.outputs.run == 'true' }}
        name: Install pnpm
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          node-version: ${{ matrix.version }}
          cache: "pnpm"
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install dependencies
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: ts
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = fast ]; then
            # The partial install may not contain better-sqlite3; let the
            # root postinstall skip its SQLite provisioning in that case.
            export TYPEAGENT_BETTER_SQLITE3_OPTIONAL=1
            pnpm install --frozen-lockfile --strict-peer-dependencies --filter . ${{ steps.scope.outputs.filters }}
          else
            pnpm install --frozen-lockfile --strict-peer-dependencies
          fi
      - name: Build
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: ts
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = fast ]; then
            pnpm ${{ steps.scope.outputs.filters }} run build
          else
            npm run build
          fi
      # On pull requests only changed files are checked (fast); the
      # format-pr workflow auto-fixes them.  Other events check the whole repo.
      - name: Lint
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: ts
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            node tools/scripts/prettier-changed.mjs --base "origin/${{ github.base_ref }}"
          else
            npm run lint
          fi
      # Complexity gate (PRs only): the files this PR changes may not add
      # functions over the cyclomatic/cognitive budget versus the base branch
      # (a stateless ratchet — the base branch is the baseline, so the count
      # can only trend down), and any brand-new file is additionally held to a
      # hard cap.  Pre-existing offenders are grandfathered by inline
      # // code-complexity-allow markers.  Tune the thresholds down as hotspots
      # get refactored.
      - name: Complexity ratchet
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.run == 'true' }}
        working-directory: ts
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          npm run code-complexity -- --ratchet --base "origin/${{ github.base_ref }}" \
            --cyclomatic 25 --cognitive 30 \
            --new-file-cyclomatic 25 --new-file-cognitive 30
      # Lint ratchet (PRs only): the files this PR changes may not add ESLint
      # violations (no-explicit-any, no-console, no-unused-vars, ...) versus the
      # base branch.  Syntactic rules only, so it is fast; the count can only
      # trend down.  Run `npm run code-lint` locally to see the full report.
      - name: Lint ratchet
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.run == 'true' }}
        working-directory: ts
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          npm run code-lint -- --ratchet --base "origin/${{ github.base_ref }}"
      # Circular-dependency ratchet (PRs only): fail if the change introduces a
      # runtime import cycle not already present at the base.  Builds the cycle
      # set for HEAD and for the merge base (via a throwaway git worktree), so
      # this step is heavier than the others (madge runs twice).
      - name: Circular dependency ratchet
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.run == 'true' }}
        working-directory: ts
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          npm run code-circular -- --ratchet --base "origin/${{ github.base_ref }}" --exceptions-file tools/scripts/code/circular-baseline-exception.json
      # Test-debt gate (PRs only): zero tolerance for focused tests
      # (.only/fit/fdescribe) and no newly skipped tests (.skip/xit/xdescribe)
      # in changed files.  A small, fixable problem -> a hard gate, not a ratchet.
      - name: Test debt gate
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.run == 'true' }}
        working-directory: ts
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          npm run code-debt -- --gate --base "origin/${{ github.base_ref }}"
      - name: Restore better-sqlite3 for Node.js
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: ts
        env:
          TYPEAGENT_BETTER_SQLITE3_OPTIONAL: ${{ steps.scope.outputs.mode == 'fast' && '1' || '0' }}
        run: |
          pnpm run postinstall:better-sqlite3-node-restore
      # Runs the unit suite once, then reruns only the packages that owned a
      # failing test up to two times (serially), stopping early on success.
      # Flaky tests are reported as annotations / a step summary but do not fail
      # the build; the final retry package suite must otherwise pass.
      - name: Test
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: ts
        env:
          TYPEAGENT_SKIP_POWERSHELL_BROKER_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = fast ]; then
            pnpm --no-bail ${{ steps.scope.outputs.test_filters }} --if-present run test:local
          else
            node tools/scripts/runTestLocalWithSummary.mjs
          fi
      - name: UI tests (requires display)
        if: ${{ steps.scope.outputs.run == 'true' && steps.scope.outputs.mode == 'full' && runner.os == 'Linux' }}
        working-directory: ts
        run: |
          Xvfb :99 -screen 0 1600x1200x24 &
          export DISPLAY=:99
          npm run test:ui
