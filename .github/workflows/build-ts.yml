name: build-ts

on:
  workflow_dispatch:
    inputs:
      macos_qualification:
        description: Run only full sharded macOS Node 24/26 coverage
        type: boolean
        default: false
      fanout_build_cache:
        description: Reuse verified exact-source compilation outputs
        type: boolean
        default: false
      fanout_native_cache:
        description: Reuse runtime-specific pnpm native builds
        type: boolean
        default: false
      fanout_compact_artifact:
        description: Use dependency-closure package and remainder artifacts
        type: boolean
        default: false
      fanout_artifact_compression:
        description: Artifact compression level
        type: choice
        options: ["0", "3", "6"]
        default: "6"
  schedule:
    - cron: "17 8 * * *"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  pull-requests: read
  contents: read
  id-token: write

env:
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      required: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ts != 'false' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            ts:
              - "ts/**"
              - ".github/workflows/build-ts.yml"
              - ".github/workflows/ci-fanout*.yml"
              - ".github/actions/fanout-setup/**"
      - name: Record coverage selection
        shell: pwsh
        env:
          CI_COVERAGE_REQUIRED: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ts != 'false' }}
        run: Write-Output "TypeScript CI required=$env:CI_COVERAGE_REQUIRED"

  sharded:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-fanout.yml
    with:
      full_macos: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.macos_qualification) }}
      build_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.fanout_build_cache }}
      native_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.fanout_native_cache }}
      compact_artifact: ${{ github.event_name == 'workflow_dispatch' && inputs.fanout_compact_artifact }}
      artifact_compression: ${{ inputs.fanout_artifact_compression || '6' }}

  typescript_ci:
    name: TypeScript CI
    if: ${{ always() }}
    needs: [changes, sharded]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful complete CI coverage
        shell: pwsh
        env:
          CI_CHANGES_RESULT: ${{ needs.changes.result }}
          CI_COVERAGE_REQUIRED: ${{ needs.changes.outputs.required }}
          CI_SHARDED_RESULT: ${{ needs.sharded.result }}
        run: |
          if ($env:CI_CHANGES_RESULT -ne 'success') { throw "Coverage selection did not succeed: $env:CI_CHANGES_RESULT" }
          if ($env:CI_COVERAGE_REQUIRED -eq 'false') { Write-Output 'No TypeScript or sharded CI paths changed'; exit 0 }
          if ($env:CI_COVERAGE_REQUIRED -ne 'true') { throw 'Missing coverage selection' }
          if ($env:CI_SHARDED_RESULT -ne 'success') { throw "Required CI coverage did not succeed: $env:CI_SHARDED_RESULT" }

  build_ts:
    # Remove only after main's ruleset requires the deployed TypeScript CI check.
    if: ${{ always() }}
    needs: typescript_ci
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.macos_qualification)) && fromJSON('["macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        version: ["24.22.1", "26.12.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Forward the aggregate result during required-check migration
        shell: pwsh
        env:
          CI_AGGREGATE_RESULT: ${{ needs.typescript_ci.result }}
        run: |
          if ($env:CI_AGGREGATE_RESULT -ne 'success') { throw "TypeScript CI did not succeed: $env:CI_AGGREGATE_RESULT" }
