# The producer never has repository-write credentials. It resolves the current
# default-branch commit through the API, checks out only that immutable commit,
# and treats pull request commits as data in a separate credential-free bare
# repository. A privileged workflow_run companion verifies the artifact again
# before it mints an App token.

name: Prepare Generated File Healing

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Single PR number to heal (default: scan all open PRs)"
        type: string

concurrency:
  group: prepare-generated-file-healing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trusted revision and pull request metadata
        id: metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const repositoryResponse = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repositoryResponse.data.default_branch;
            const branchResponse = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: defaultBranch,
            });
            const trustedSha = branchResponse.data.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(trustedSha)) {
              core.setFailed("The default branch did not resolve to a full commit SHA.");
              return;
            }
            if (
              context.eventName === "push" &&
              context.ref !== `refs/heads/${defaultBranch}`
            ) {
              core.setFailed(
                `Push trigger ${context.ref} is not the repository default branch ${defaultBranch}.`,
              );
              return;
            }

            let pullRequests;
            const requested = context.payload.inputs?.pr?.trim();
            if (context.eventName === "pull_request") {
              pullRequests = [
                (
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: context.payload.pull_request.number,
                  })
                ).data,
              ];
            } else if (requested) {
              if (!/^[1-9]\d*$/.test(requested)) {
                core.setFailed(`Invalid pull request number: ${requested}`);
                return;
              }
              pullRequests = [
                (
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: Number(requested),
                  })
                ).data,
              ];
            } else {
              pullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                base: defaultBranch,
                per_page: 100,
              });
              pullRequests = pullRequests.filter(
                (pullRequest) => pullRequest.head.repo?.full_name === repository,
              );
            }

            const metadata = {
              repository,
              defaultBranch,
              trustedSha,
              runId: process.env.GITHUB_RUN_ID,
              pullRequests: pullRequests.map((pullRequest) => ({
                number: pullRequest.number,
                state: pullRequest.state,
                isCrossRepository:
                  pullRequest.head.repo?.full_name !== pullRequest.base.repo?.full_name,
                headRepository: pullRequest.head.repo?.full_name,
                headRefName: pullRequest.head.ref,
                headSha: pullRequest.head.sha,
                baseRefName: pullRequest.base.ref,
                baseSha: pullRequest.base.sha,
              })),
            };
            const metadataPath = path.join(
              process.env.RUNNER_TEMP,
              "generated-file-healing-metadata.json",
            );
            fs.writeFileSync(metadataPath, `${JSON.stringify(metadata, null, 2)}\n`);
            core.setOutput("path", metadataPath);
            core.setOutput("default_branch", defaultBranch);
            core.setOutput("trusted_sha", trustedSha);

      - name: Checkout trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.metadata.outputs.trusted_sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Verify trusted implementation revision
        env:
          DEFAULT_BRANCH: ${{ steps.metadata.outputs.default_branch }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_SHA: ${{ steps.metadata.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_SHA"
          remote_sha="$(
            git -c credential.helper= -c credential.interactive=never \
              ls-remote "https://github.com/${REPOSITORY}.git" \
              "refs/heads/${DEFAULT_BRANCH}" | awk '{print $1}'
          )"
          test "$remote_sha" = "$TRUSTED_SHA"
          git -C trusted merge-base --is-ancestor "$TRUSTED_SHA" "$remote_sha"

      - name: Install trusted pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: trusted/ts/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Prepare credential-free healing candidates
        env:
          METADATA_PATH: ${{ steps.metadata.outputs.path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node trusted/ts/tools/scripts/heal-generated-files.mjs prepare \
            --metadata "$METADATA_PATH" \
            --output "$RUNNER_TEMP/generated-file-healing" \
            --repository-url "https://github.com/${REPOSITORY}.git" \
            --pnpm "$(command -v pnpm)"

      - name: Upload healing candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-file-healing-${{ github.run_id }}
          path: ${{ runner.temp }}/generated-file-healing
          if-no-files-found: error
          retention-days: 1
