# Automatically remediate Dependabot security alerts by running the
# fix-dependabot-alerts script, verifying the build for each fix,
# and opening a pull request with the passing changes.
#
# Uses a GitHub App (via actions/create-github-app-token) to authenticate
# with the Dependabot alerts REST API, since GITHUB_TOKEN does not have
# access to this endpoint. Requires DEPENDABOT_APP_ID (variable) and
# DEPENDABOT_APP_PRIVATE_KEY (secret).

name: fix-dependabot-alerts

on:
  schedule:
    # Run daily at 9:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — analyse only, don't apply fixes"
        type: boolean
        default: false
      auto-fix-args:
        description: "Extra script flags (e.g. --show-chains=full); package scope is selected by the workflow"
        type: string
        default: "--auto-fix"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  fix-alerts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}

      - name: Verify gh authentication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth status
          echo "---"
          # Probe the Dependabot API with a 1-item page. If the call fails the
          # subsequent discovery step would silently produce an empty workspace
          # list and the entire job would report "No fixable alerts found" —
          # masking infra outages as "everything's fine". Fail fast instead.
          if ! gh api "repos/${{ github.repository }}/dependabot/alerts?per_page=1" --jq 'length'; then
            echo "::error::Dependabot API probe failed — aborting before silently misreporting alerts"
            exit 1
          fi

      # Install ts/ dependencies once before the per-workspace loop.
      # The fix-dependabot-alerts.mjs script lives under ts/tools/scripts/ and
      # imports node modules (chalk, etc.) from ts/node_modules. Without this
      # step, when the per-workspace loop processes a non-ts workspace first
      # (e.g. docs/), Node fails with ERR_MODULE_NOT_FOUND for chalk and the
      # workflow silently logs "No valid analysis for <ws> — skipping".
      - name: Install script dependencies (ts workspace)
        working-directory: ts
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Restore per-package rollback memory across runs. When a fix attempt
      # rolls back (build/install failure), we record the package + lockfile
      # SHA so subsequent daily runs skip retrying the same broken upgrade
      # until either (a) the cooldown expires (default 7 days) or (b) the
      # underlying lockfile changes (different SHA → potentially different
      # outcome). Without this, the workflow burns CI minutes attempting
      # the same hopeless rollback every single day.
      - name: Restore rollback memory
        id: rollback-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/dep-rollback-state.json
          key: dep-rollback-state-v1-${{ github.run_id }}
          restore-keys: |
            dep-rollback-state-v1-

      # ── Analyse and fix alerts across workspaces ──────────────────────
      #
      # Auto-discovers which workspaces have open alerts by querying the
      # Dependabot API, then for each workspace:
      # 1. Installs dependencies (if not already installed)
      # 2. Dry-run to discover fixable packages
      # 3. Applies each package's fix individually
      # 4. Build-checks after each; rolls back failures
      # 5. Only passing fixes survive into the PR
      - name: Analyse and fix alerts
        id: fix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Enforce the org's 7-day release-age policy in every workspace the
          # script processes. Without this, workspaces that lack a
          # pnpm-workspace.yaml (e.g. docs/) would fall back to 0 (disabled)
          # and could still pin versions published fewer than 7 days ago.
          DEPENDABOT_MIN_RELEASE_AGE_DAYS: "7"
          REMEDIATION_EXTRA_ARGS: ${{ inputs.auto-fix-args || '--auto-fix' }}
        run: |
          SCRIPT="$GITHUB_WORKSPACE/ts/tools/scripts/fix-dependabot-alerts.mjs"
          FLAGS=$(node "$GITHUB_WORKSPACE/ts/tools/scripts/remediationWorkflowArgs.mjs")
          ALL_APPLIED=""
          ALL_ROLLED_BACK=""
          ALL_SKIPPED_RECENT_ROLLBACK=""
          ALL_BLOCKED_PACKAGES=""
          ALL_NO_PATCH_PACKAGES=""
          ALL_DEFERRED_PACKAGES=""
          ALL_FAILED_WORKSPACES=""
          TOTAL_RESOLVED=0
          TOTAL_BLOCKED=0
          TOTAL_NO_PATCH=0
          TOTAL_DEFERRED=0
          MIN_AGE_DAYS=""
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0

          # Rollback memory: skip retrying any (workspace,pkg) that rolled
          # back recently against the *current* lockfile SHA. Cooldown is in
          # days; entries older than this are considered stale and retried.
          ROLLBACK_STATE=/tmp/dep-rollback-state.json
          ROLLBACK_COOLDOWN_DAYS=7
          if [ ! -f "$ROLLBACK_STATE" ]; then
            echo '{"version":1,"rollbacks":{}}' > "$ROLLBACK_STATE"
          fi
          NOW_EPOCH=$(date -u +%s)
          COOLDOWN_SECONDS=$((ROLLBACK_COOLDOWN_DAYS * 86400))

          # Discover workspaces with open npm alerts from the Dependabot API.
          #
          # NOTE: `split("/")[0]` collapses every alert manifest_path to its
          # leading directory (so `ts/packages/X/package.json` → `ts`). This is
          # correct for this repo because the only pnpm workspace roots are
          # `ts/` and `docs/`, but it would silently misroute alerts whose
          # manifest_path points outside those roots (e.g. a future workspace
          # under `subprojects/foo/package.json`). Revisit if/when a third
          # workspace root is added.
          WORKSPACES=$(gh api "repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" \
            --paginate \
            --jq '[.[] | select(.dependency.package.ecosystem == "npm") | .dependency.manifest_path | split("/")[0]] | unique | .[]')

          if [ -z "$WORKSPACES" ]; then
            echo "No open npm Dependabot alerts found 🎉"
            echo "resolved=0" >> "$GITHUB_OUTPUT"
            echo "blocked=0" >> "$GITHUB_OUTPUT"
            echo "no_patch=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Workspaces with alerts: $WORKSPACES"

          for WS_DIR in $WORKSPACES; do
            echo "=========================================="
            echo "Processing workspace: $WS_DIR"
            echo "=========================================="
            cd "$GITHUB_WORKSPACE/$WS_DIR"

            # Install dependencies for this workspace.
            # The `ts` workspace was already installed in the "Install script
            # dependencies (ts workspace)" step — re-running pnpm install here
            # re-triggers postinstall scripts (e.g. better-sqlite3 copy/restore)
            # which can segfault on the second pass. Skip the redundant install.
            echo "::group::Installing $WS_DIR dependencies"
            corepack enable
            if [ "$WS_DIR" = "ts" ]; then
              echo "ts dependencies already installed in setup step; skipping redundant install"
            elif ! pnpm install --frozen-lockfile 2>&1; then
              echo "::warning::Dependency install failed for $WS_DIR — skipping (analysis would be unreliable)"
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"

            # ── Step 1: Discover fixable packages ───────────────────
            echo "::group::Analysing $WS_DIR alerts"
            node "$SCRIPT" --dry-run --json --skip-install > /tmp/dep-analysis.json 2>/tmp/dep-analysis.log || true

            if ! jq -e '.summary' /tmp/dep-analysis.json > /dev/null 2>&1; then
              echo "::warning::No valid analysis for $WS_DIR — see log below"
              cat /tmp/dep-analysis.log || true
              # Surface to job summary so the failure isn't silent across runs.
              {
                echo "### ⚠️ Analysis failed for \`$WS_DIR\`"
                echo ""
                echo '```'
                tail -30 /tmp/dep-analysis.log 2>/dev/null || echo "(no log captured)"
                echo '```'
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              # Track for the PR body / final summary.
              ALL_FAILED_WORKSPACES="${ALL_FAILED_WORKSPACES:+$ALL_FAILED_WORKSPACES, }$WS_DIR"
              echo "::endgroup::"
              continue
            fi

            WS_BLOCKED=$(jq '.summary.blocked' /tmp/dep-analysis.json)
            WS_NO_PATCH=$(jq '.summary.noPatch' /tmp/dep-analysis.json)
            WS_DEFERRED=$(jq '.summary.deferred // 0' /tmp/dep-analysis.json)
            BLOCKED_PKGS=$(jq -r '[.blocked[].package] | unique | join(", ")' /tmp/dep-analysis.json)
            NO_PATCH_PKGS=$(jq -r '[.noPatch[].package] | unique | join(", ")' /tmp/dep-analysis.json)
            # Deferred packages carry an eligibility date; show it inline so
            # reviewers know when each fix becomes adoptable.
            DEFERRED_PKGS=$(jq -r '[.deferred[]? | .package + (if .deferredUntil then " (eligible " + .deferredUntil[0:10] + ")" else "" end)] | unique | join(", ")' /tmp/dep-analysis.json)
            # Minimum release age (days) the script deferred against — the same
            # across workspaces; capture the first non-empty value for display.
            if [ -z "$MIN_AGE_DAYS" ]; then
              MIN_AGE_DAYS=$(jq -r '.minReleaseAgeDays // empty' /tmp/dep-analysis.json)
            fi

            # If there are blocked packages, capture --show-chains output
            # for the PR body so reviewers can see why each was blocked
            # without having to re-run the script locally.
            if [ "$WS_BLOCKED" -gt 0 ]; then
              echo "Capturing dependency chains for $WS_BLOCKED blocked package(s) in $WS_DIR"
              CHAINS_OUT="/tmp/dep-chains-$WS_DIR.txt"
              NO_COLOR=1 node "$SCRIPT" --dry-run --show-chains --skip-install \
                > "$CHAINS_OUT" 2>&1 || true
              if [ -s "$CHAINS_OUT" ]; then
                {
                  echo ""
                  echo "===== $WS_DIR ====="
                  cat "$CHAINS_OUT"
                } >> /tmp/all-blocked-chains.txt
              fi
            fi

            FIXABLE=$(jq -r '.resolved[].package' /tmp/dep-analysis.json | sort -u)
            FIXABLE_COUNT=$(echo "$FIXABLE" | grep -c . || true)
            echo "Fixable $WS_DIR packages ($FIXABLE_COUNT): $FIXABLE"
            echo "::endgroup::"

            # Accumulate blocked/no-patch/deferred
            TOTAL_BLOCKED=$((TOTAL_BLOCKED + WS_BLOCKED))
            TOTAL_NO_PATCH=$((TOTAL_NO_PATCH + WS_NO_PATCH))
            TOTAL_DEFERRED=$((TOTAL_DEFERRED + WS_DEFERRED))
            [ -n "$BLOCKED_PKGS" ] && ALL_BLOCKED_PACKAGES="${ALL_BLOCKED_PACKAGES:+$ALL_BLOCKED_PACKAGES, }$BLOCKED_PKGS"
            [ -n "$NO_PATCH_PKGS" ] && ALL_NO_PATCH_PACKAGES="${ALL_NO_PATCH_PACKAGES:+$ALL_NO_PATCH_PACKAGES, }$NO_PATCH_PKGS"
            [ -n "$DEFERRED_PKGS" ] && ALL_DEFERRED_PACKAGES="${ALL_DEFERRED_PACKAGES:+$ALL_DEFERRED_PACKAGES, }$DEFERRED_PKGS"

            if [ "$FIXABLE_COUNT" -eq 0 ]; then
              echo "No fixable alerts in $WS_DIR"
              continue
            fi

            if [ "${{ inputs.dry-run }}" == "true" ]; then
              TOTAL_RESOLVED=$((TOTAL_RESOLVED + FIXABLE_COUNT))
              continue
            fi

            # ── Step 2: Apply fixes one package at a time ───────────
            for PKG in $FIXABLE; do
              echo "::group::Fixing $WS_DIR/$PKG"

              # Recompute LOCK_SHA per package: earlier successful fixes in
              # the same run mutate pnpm-lock.yaml, so a once-per-workspace
              # snapshot would make the rollback cooldown skip key drift away
              # from the actual on-disk lockfile state.
              LOCK_SHA=$(sha256sum pnpm-lock.yaml 2>/dev/null | awk '{print $1}' || echo "no-lock")

              # Skip if this (workspace,pkg,lockSha) recently rolled back.
              ROLLBACK_KEY="$WS_DIR/$PKG"
              PREV_TS=$(jq -r --arg k "$ROLLBACK_KEY" --arg sha "$LOCK_SHA" \
                '.rollbacks[$k] | select(.lockSha == $sha) | .timestamp // empty' \
                "$ROLLBACK_STATE")
              if [ -n "$PREV_TS" ]; then
                AGE=$((NOW_EPOCH - PREV_TS))
                if [ "$AGE" -lt "$COOLDOWN_SECONDS" ]; then
                  AGE_DAYS=$((AGE / 86400))
                  echo "⏭️  Skipping $PKG: rolled back ${AGE_DAYS}d ago against same lockfile (cooldown ${ROLLBACK_COOLDOWN_DAYS}d)"
                  ALL_SKIPPED_RECENT_ROLLBACK="$ALL_SKIPPED_RECENT_ROLLBACK $PKG"
                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                  echo "::endgroup::"
                  continue
                fi
              fi

              # Save a rollback point
              cp package.json /tmp/pkg-backup.json
              cp pnpm-lock.yaml /tmp/lock-backup.yaml 2>/dev/null || true

              # Build targeted args
              read -r -a filtered_args <<< "$FLAGS"
              filtered_args+=("--auto-fix=$PKG")
              filtered_args+=("--skip-install")
              echo "Running: fix-dependabot-alerts.mjs ${filtered_args[*]}"
              set +e
              node "$SCRIPT" "${filtered_args[@]}" 2>&1
              fix_exit=$?
              set -e

              if [ "$fix_exit" -ne 0 ] && git diff --quiet; then
                echo "::warning::Script failed for $PKG in $WS_DIR (exit $fix_exit) with no file changes"
                TOTAL_FAILED=$((TOTAL_FAILED + 1))
                echo "::endgroup::"
                continue
              fi

              if ! git diff --quiet; then
                echo "Changes detected, reinstalling and verifying build..."
                set +e
                if [ "$WS_DIR" = "ts" ]; then
                  pnpm install --frozen-lockfile --strict-peer-dependencies 2>&1
                else
                  pnpm install --frozen-lockfile 2>&1
                fi
                install_exit=$?
                set -e

                if [ "$install_exit" -ne 0 ]; then
                  echo "::warning::pnpm install failed after fixing $PKG in $WS_DIR — rolling back"
                  cp /tmp/pkg-backup.json package.json
                  cp /tmp/lock-backup.yaml pnpm-lock.yaml 2>/dev/null || true
                  pnpm install 2>&1 || true
                  git checkout -- . 2>/dev/null || true
                  ALL_ROLLED_BACK="$ALL_ROLLED_BACK $PKG"
                  TOTAL_FAILED=$((TOTAL_FAILED + 1))
                  jq --arg k "$ROLLBACK_KEY" --arg sha "$LOCK_SHA" \
                     --argjson ts "$NOW_EPOCH" --arg reason "install failed" \
                     '.rollbacks[$k] = {lockSha:$sha,timestamp:$ts,reason:$reason}' \
                     "$ROLLBACK_STATE" > "$ROLLBACK_STATE.tmp" && mv "$ROLLBACK_STATE.tmp" "$ROLLBACK_STATE"
                  echo "::endgroup::"
                  continue
                fi

                if [ "$WS_DIR" = "ts" ]; then
                  node tools/scripts/repo-policy-check.mjs --fix 2>/dev/null || true
                fi

                set +e
                pnpm run build 2>&1
                build_exit=$?
                set -e

                if [ "$build_exit" -ne 0 ]; then
                  echo "::warning::Build failed after fixing $PKG in $WS_DIR — rolling back"
                  cp /tmp/pkg-backup.json package.json
                  cp /tmp/lock-backup.yaml pnpm-lock.yaml 2>/dev/null || true
                  pnpm install 2>&1 || true
                  git checkout -- . 2>/dev/null || true
                  ALL_ROLLED_BACK="$ALL_ROLLED_BACK $PKG"
                  TOTAL_FAILED=$((TOTAL_FAILED + 1))
                  jq --arg k "$ROLLBACK_KEY" --arg sha "$LOCK_SHA" \
                     --argjson ts "$NOW_EPOCH" --arg reason "build failed" \
                     '.rollbacks[$k] = {lockSha:$sha,timestamp:$ts,reason:$reason}' \
                     "$ROLLBACK_STATE" > "$ROLLBACK_STATE.tmp" && mv "$ROLLBACK_STATE.tmp" "$ROLLBACK_STATE"
                else
                  echo "✅ $PKG fixed and build passed"
                  ALL_APPLIED="$ALL_APPLIED $PKG"
                  TOTAL_RESOLVED=$((TOTAL_RESOLVED + 1))
                  # Successful upgrade — clear any stale rollback record.
                  jq --arg k "$ROLLBACK_KEY" 'del(.rollbacks[$k])' \
                     "$ROLLBACK_STATE" > "$ROLLBACK_STATE.tmp" && mv "$ROLLBACK_STATE.tmp" "$ROLLBACK_STATE"
                fi
              else
                echo "No changes for $PKG (may already be fixed)"
              fi

              echo "::endgroup::"
            done
          done

          # ── Step 3: Report results ──────────────────────────────────
          # Prune rollback entries older than the cooldown window so the
          # state file doesn't grow unbounded.
          STALE_THRESHOLD=$((NOW_EPOCH - COOLDOWN_SECONDS))
          jq --argjson th "$STALE_THRESHOLD" \
             '.rollbacks |= with_entries(select(.value.timestamp >= $th))' \
             "$ROLLBACK_STATE" > "$ROLLBACK_STATE.tmp" && mv "$ROLLBACK_STATE.tmp" "$ROLLBACK_STATE"

          export FIX_RESOLVED="$TOTAL_RESOLVED" FIX_BLOCKED="$TOTAL_BLOCKED"
          export FIX_NO_PATCH="$TOTAL_NO_PATCH" FIX_DEFERRED="$TOTAL_DEFERRED"
          export FIX_MIN_RELEASE_AGE_DAYS="$MIN_AGE_DAYS" FIX_FAILED="$TOTAL_FAILED"
          export FIX_SKIPPED="$TOTAL_SKIPPED" FIX_APPLIED_PACKAGES="$ALL_APPLIED"
          export FIX_ROLLED_BACK_PACKAGES="$ALL_ROLLED_BACK"
          export FIX_SKIPPED_PACKAGES="$ALL_SKIPPED_RECENT_ROLLBACK"
          export FIX_BLOCKED_PACKAGES="$ALL_BLOCKED_PACKAGES"
          export FIX_NO_PATCH_PACKAGES="$ALL_NO_PATCH_PACKAGES"
          export FIX_DEFERRED_PACKAGES="$ALL_DEFERRED_PACKAGES"
          export FIX_FAILED_WORKSPACES="$ALL_FAILED_WORKSPACES"
          node "$GITHUB_WORKSPACE/ts/tools/scripts/remediationReport.mjs" outputs

          cd "$GITHUB_WORKSPACE"
          if git diff --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Files changed:"
            git diff --stat
          fi

      # ── Final build + shell packaging verification ──────────────────
      - name: Final build verification
        if: ${{ steps.fix.outputs.changes == 'true' }}
        id: build
        working-directory: ts
        run: |
          node tools/scripts/repo-policy-check.mjs --fix || true
          # Use `rebuild` (fluid-build --rebuild), not `build`, so the
          # verification matches the clean-checkout CI build_ts job.
          # fluid-build's incremental cache and tsc's .tsbuildinfo are
          # keyed off the package's own sources + declared dep specs in
          # package.json; an in-range transitive dep upgrade doesn't
          # bust the cache, so a breaking .d.ts change in a dep can
          # pass the incremental build here while still failing CI's
          # fresh build.
          pnpm run rebuild
          echo "build_ok=true" >> "$GITHUB_OUTPUT"
        env:
          DEBUG_DEMB: true

      - name: Package - shell
        if: ${{ steps.build.outputs.build_ok == 'true' }}
        id: shell
        working-directory: ts
        run: |
          pnpm run shell:package
          echo "shell_ok=true" >> "$GITHUB_OUTPUT"

      # ── Create PR ───────────────────────────────────────────────────
      # GitHub App installation tokens expire after 1 hour. The build/verify
      # phase routinely runs longer than that, so the original app-token
      # minted at job start is expired by the time we get here, causing
      # `gh pr create` to fail with 401 Bad credentials (the `git push`
      # itself works because actions/checkout uses the workflow's own
      # GITHUB_TOKEN, which is valid for the full job lifetime). Mint a
      # fresh app token immediately before any late-running `gh` calls.
      - name: Refresh GitHub App token
        id: app-token-pr
        if: ${{ steps.fix.outputs.changes == 'true' && steps.build.outputs.build_ok == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}

      - name: Create pull request
        id: pr
        if: ${{ steps.fix.outputs.changes == 'true' && steps.build.outputs.build_ok == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token-pr.outputs.token }}
          REMEDIATION_OUTPUTS: ${{ toJSON(steps.fix.outputs) }}
          REMEDIATION_SHELL_OK: ${{ steps.shell.outputs.shell_ok }}
          REMEDIATION_CHAIN_FILE: /tmp/all-blocked-chains.txt
        run: |
          BRANCH="automated/fix-dependabot-alerts-$(date +%Y%m%d)-$GITHUB_RUN_NUMBER"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          node "$GITHUB_WORKSPACE/ts/tools/scripts/remediationReport.mjs" files
          git commit -F "$RUNNER_TEMP/remediation-commit.txt"

          git push origin "$BRANCH"

          # Close any previously-open PRs from this workflow before opening a
          # new one. Each daily run produces a unique branch (date + run_number),
          # so without dedup the repo accumulates stacking duplicate PRs when
          # yesterday's hasn't merged yet. The freshest PR always wins because
          # it incorporates the latest set of fixes (and re-verifies the build).
          PREV_PRS=$(gh pr list \
            --state open \
            --search 'head:automated/fix-dependabot-alerts- in:branch' \
            --json number,headRefName \
            --jq '.[] | select(.headRefName != "'"$BRANCH"'") | .number')
          if [ -n "$PREV_PRS" ]; then
            echo "Closing superseded Dependabot fix PRs: $PREV_PRS"
            for PR in $PREV_PRS; do
              gh pr close "$PR" \
                --delete-branch \
                --comment "Superseded by a newer automated Dependabot fix PR." \
                || echo "::warning::Failed to close PR #$PR"
            done
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix: remediate Dependabot security alerts ($(date +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/remediation-pr.md" \
            --label "dependencies,security"

      # ── Summary ─────────────────────────────────────────────────────
      - name: Job summary
        if: always()
        env:
          REMEDIATION_OUTPUTS: ${{ toJSON(steps.fix.outputs) }}
          REMEDIATION_SHELL_OK: ${{ steps.shell.outputs.shell_ok }}
          REMEDIATION_DRY_RUN: ${{ inputs.dry-run }}
          REMEDIATION_FIX_OUTCOME: ${{ steps.fix.outcome }}
          REMEDIATION_PR_CREATED: ${{ steps.pr.outcome == 'success' }}
        run: |
          node "$GITHUB_WORKSPACE/ts/tools/scripts/remediationReport.mjs" summary
