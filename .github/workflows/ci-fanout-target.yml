name: Build/test one supported target

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      version:
        type: string
        required: true
      include_controls:
        type: boolean
        default: false
      build_cache:
        type: boolean
        default: false
      native_cache:
        type: boolean
        default: false
      compact_artifact:
        type: boolean
        default: false
      artifact_compression:
        type: string
        default: "6"

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: --max_old_space_size=8192
  TYPEAGENT_SKIP_POWERSHELL_BROKER_TESTS: ${{ inputs.os == 'windows-latest' && '1' || '0' }}

defaults:
  run:
    shell: pwsh
    working-directory: ts

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fanout-setup
        with:
          node-version: ${{ inputs.version }}
          native-cache: ${{ inputs.native_cache }}
          save-native-cache: "true"
      - name: Build memory service and its test-time client once
        run: npm exec --no -- fluid-build "^@typeagent/memory-client$" -t build --dep
      - name: Discover tests and fingerprint compiled outputs
        run: node tools/scripts/ciFanoutExperiment.mjs create
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fanout-build-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/fanout-build
          compression-level: ${{ fromJSON(inputs.artifact_compression) }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  workspace_build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fanout-setup
        with:
          node-version: ${{ inputs.version }}
          native-cache: ${{ inputs.native_cache }}
      - name: Compute exact-source build cache identity
        id: cache_identity
        if: inputs.build_cache
        run: node tools/scripts/ciBuildCache.mjs key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build_cache
        if: inputs.build_cache
        with:
          path: ${{ runner.temp }}/fanout-build-cache
          key: ${{ steps.cache_identity.outputs.key }}
      - name: Verify and restore coherent cached outputs
        if: inputs.build_cache && steps.build_cache.outputs.cache-hit == 'true'
        run: node tools/scripts/ciBuildCache.mjs restore
      - name: Build workspace with normal fluid-build validation even on cache hits
        run: pnpm run build
      - name: Seal build outputs and incremental metadata for an exact-source cache
        if: inputs.build_cache && steps.build_cache.outputs.cache-hit != 'true'
        run: node tools/scripts/ciBuildCache.mjs create
      - name: Fingerprint workspace outputs and plan duration-balanced partitions
        env:
          TYPEAGENT_COMPACT_ARTIFACT: ${{ inputs.compact_artifact }}
        run: node tools/scripts/ciPackagePartitions.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fanout-workspace-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/fanout-workspace-build
          compression-level: ${{ fromJSON(inputs.artifact_compression) }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.compact_artifact && inputs.os != 'macos-latest'
        with:
          name: fanout-packages-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/fanout-package-build
          compression-level: ${{ fromJSON(inputs.artifact_compression) }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.compact_artifact
        with:
          name: fanout-remainder-1-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/fanout-remainder-build-1
          compression-level: ${{ fromJSON(inputs.artifact_compression) }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.compact_artifact && inputs.os != 'macos-latest'
        with:
          name: fanout-remainder-2-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/fanout-remainder-build-2
          compression-level: ${{ fromJSON(inputs.artifact_compression) }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.compact_artifact && inputs.os != 'macos-latest'
        with:
          name: fanout-remainder-3-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/fanout-remainder-build-3
          compression-level: ${{ fromJSON(inputs.artifact_compression) }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.compact_artifact && inputs.os != 'macos-latest'
        with:
          name: fanout-remainder-4-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/fanout-remainder-build-4
          compression-level: ${{ fromJSON(inputs.artifact_compression) }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  remainder:
    needs: workspace_build
    strategy:
      fail-fast: false
      matrix:
        group: ${{ inputs.os == 'macos-latest' && fromJSON('["1"]') || fromJSON('["1","2","3","4"]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fanout-setup
        with:
          node-version: ${{ inputs.version }}
          native-cache: ${{ inputs.native_cache }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fanout-${{ inputs.compact_artifact && format('remainder-{0}', matrix.group) || 'workspace' }}-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ts
      - name: Test duration-balanced whole-package lanes with existing retries
        env:
          TYPEAGENT_REMAINDER_ARTIFACT_SCOPE: ${{ inputs.compact_artifact && 'remainder' || 'workspace' }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'typeagent-test.log'
          node tools/scripts/ciWorkspaceLanes.mjs test ${{ matrix.group }} 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fanout-lane-${{ inputs.os }}-${{ inputs.version }}-${{ matrix.group }}
          path: ${{ runner.temp }}/fanout-lanes/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fanout-remaining-log-${{ inputs.os }}-${{ inputs.version }}-${{ matrix.group }}
          path: ${{ runner.temp }}/typeagent-test.log
          if-no-files-found: warn
          retention-days: 14

  roots:
    needs: workspace_build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fanout-setup
        with:
          node-version: ${{ inputs.version }}
          native-cache: ${{ inputs.native_cache }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fanout-workspace-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ts
      - name: Verify workspace runtime closure without rebuilding
        run: node tools/scripts/ciPackagePartitions.mjs verify
      - name: Profile independent root-unit and memory-quality phases
        env:
          TYPEAGENT_TEST_PHASE: scripts
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'typeagent-root-test.log'
          node tools/scripts/runTestLocalWithSummary.mjs 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fanout-root-log-${{ inputs.os }}-${{ inputs.version }}
          path: ${{ runner.temp }}/typeagent-root-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: UI tests (requires display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1600x1200x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          npm run test:ui

  package_partitions:
    needs: workspace_build
    if: inputs.os != 'macos-latest'
    strategy:
      fail-fast: false
      matrix:
        group: ["1", "2", "3", "4"]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fanout-setup
        with:
          node-version: ${{ inputs.version }}
          native-cache: ${{ inputs.native_cache }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fanout-${{ inputs.compact_artifact && 'packages' || 'workspace' }}-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ts
      - name: Test duration-balanced dispatcher and provider groups with retries
        env:
          TYPEAGENT_PARTITION_ARTIFACT_SCOPE: ${{ inputs.compact_artifact && 'packages' || 'workspace' }}
        run: node tools/scripts/ciPackagePartitions.mjs test ${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fanout-partition-${{ inputs.os }}-${{ inputs.version }}-${{ matrix.group }}
          path: ${{ runner.temp }}/fanout-partitions/*
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: ${{ inputs.include_controls && fromJSON('["1","2","3","4","control"]') || fromJSON('["1","2","3","4"]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 65
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fanout-setup
        with:
          node-version: ${{ inputs.version }}
          native-cache: ${{ inputs.native_cache }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fanout-build-${{ inputs.os }}-${{ inputs.version }}-${{ github.sha }}
          path: ts
      - name: Verify and test downloaded outputs without rebuilding
        run: node tools/scripts/ciFanoutExperiment.mjs test ${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fanout-result-${{ inputs.os }}-${{ inputs.version }}-${{ matrix.group }}
          path: ${{ runner.temp }}/fanout-results/*
          if-no-files-found: error
          retention-days: 7
