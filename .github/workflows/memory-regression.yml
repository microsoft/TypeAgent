name: memory-regression

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: ts
    steps:
      - name: Setup Git LF
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Build memory service
        id: build
        run: |
          if (Test-Path $PROFILE) { . $PROFILE }
          pnpm run build @typeagent/memory-service
      - name: Restore better-sqlite3 for Node.js
        run: pnpm run postinstall:better-sqlite3-node-restore
      - name: Memory correctness tests
        timeout-minutes: 30
        run: pnpm --filter @typeagent/memory-service run test:local --runInBand --json --outputFile=memory-local-results.json
      - name: Memory scaling regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm --filter @typeagent/memory-service run test:regression --json --outputFile=memory-regression-results.json
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-results-${{ matrix.os }}
          path: ts/packages/memory/service/memory-*-results.json
          if-no-files-found: warn
          retention-days: 14
