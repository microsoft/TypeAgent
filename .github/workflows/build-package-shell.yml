# This workflow will build and package the TypeAgent TypeScript code

name: build-package-shell

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  build_package_shell:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        version: [22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup Git LF
        run: |
          git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          filters: |
            ts:
              - "ts/**"
              - ".github/workflows/build-package-shell.yml"
      # Required check names stay on every OS cell.  PRs keep ubuntu as a
      # packaging smoke; macos/windows package on push/merge_group/main.
      # See ts/tools/scripts/prCiScope.mjs.
      - name: Decide job scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          TS_FILTER: ${{ steps.filter.outputs.ts }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_VERSION: ${{ matrix.version }}
        run: node ts/tools/scripts/prCiScope.mjs
      - uses: pnpm/action-setup@v4
        if: ${{ steps.scope.outputs.package == 'true' }}
        name: Install pnpm
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v5
        if: ${{ steps.scope.outputs.package == 'true' }}
        with:
          node-version: ${{ matrix.version }}
          cache: "pnpm"
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install dependencies
        if: ${{ steps.scope.outputs.package == 'true' }}
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Build
        if: ${{ steps.scope.outputs.package == 'true' }}
        working-directory: ts
        run: |
          pnpm run build:shell
        env:
          DEBUG_DEMB: true
      # Reusing the cache can be flaky. If a downloaded archive is corrupted it can cause
      # problems because github tries to reuse the same machine for the next job leading to
      # blocked builds. This is a bug in electron-builder, it's not smart enough to retry acquiring the archive.
      # Disabling for now.
      # - name: Electron Builder Cache
      #   if: ${{ steps.scope.outputs.package == 'true' }}
      #   uses: actions/cache@v4
      #   with:
      #     key: electron | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('**/pnpm-lock.yaml') }}
      #     path: |
      #       ${{ env.ELECTRON_BUILDER_CACHE }}
      #       ${{ env.ELECTRON_CACHE }}
      #     restore-keys: |
      #       electron | ${{ runner.os }} | ${{ runner.arch }}
      - name: Package - shell
        if: ${{ steps.scope.outputs.package == 'true' }}
        working-directory: ts
        shell: bash
        run: pnpm run shell:package

      # - uses: actions/upload-artifact@v5
      #   if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ts != 'false' }}
      #   name: Upload build artifact
      #   with:
      #     name: typeagent-shell-${{ matrix.os }}-${{ github.run_number }}
      #     path: ts/packages/shell/dist/**                             # files/dirs to include
      #     retention-days: 7
