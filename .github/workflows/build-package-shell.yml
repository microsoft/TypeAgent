# This workflow will build and package the TypeAgent TypeScript code

name: build-package-shell

# Packaging runs nightly and on demand. PR and merge-queue triggers stay only
# because build_package_shell is a required check; there the job skips all
# steps and passes, unless a PR edits this workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  build_package_shell:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        version: [22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup Git LF
        run: |
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        continue-on-error: true
        with:
          filters: |
            workflow:
              - ".github/workflows/build-package-shell.yml"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.filter.outputs.workflow != 'false') }}
        name: Install pnpm
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.filter.outputs.workflow != 'false') }}
        with:
          node-version: ${{ matrix.version }}
          cache: "pnpm"
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install dependencies
        if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.filter.outputs.workflow != 'false') }}
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Build
        if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.filter.outputs.workflow != 'false') }}
        working-directory: ts
        run: |
          pnpm run build:shell
        env:
          DEBUG_DEMB: true
      - name: Package - shell
        if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.filter.outputs.workflow != 'false') }}
        working-directory: ts
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm run shell:package; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Shell packaging failed; retrying in 30 seconds (attempt $((attempt + 1)) of 3)."
              sleep 30
            fi
          done

          exit 1
