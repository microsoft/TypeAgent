# Privileged companion to codeql.yml.
#
# CodeQL analysis of a fork pull request runs in codeql.yml under the unprivileged
# `pull_request` event (read-only token, no secrets) and stores its SARIF as an
# artifact. This workflow runs after that completes, in the trusted context of the
# base repository (write token), and uploads the SARIF to code scanning so the
# "Require code scanning results" ruleset rule is satisfied for fork PRs.
#
# SECURITY: This job must NEVER check out or execute the pull request's code. It
# only downloads the SARIF artifact and uploads it. The destination ref/sha are
# derived from the TRUSTED workflow_run payload (head_sha) plus a server-side PR
# lookup — never from artifact contents — so a malicious fork cannot redirect
# results to another ref. This is the safe alternative to pull_request_target.

name: CodeQL fork upload

on:
  workflow_run:
    workflows: ["CodeQL Advanced"]
    types: [completed]

concurrency:
  group: codeql-fork-upload-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify fork analysis producer and artifacts
    runs-on: ubuntu-latest
    # Only fork PR analysis runs that finished successfully. Push and
    # internal-branch runs already uploaded their own results in codeql.yml.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.fork == true
    permissions:
      actions: read # download artifacts from the triggering run
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.analysis.outputs.number }}
      sha: ${{ steps.analysis.outputs.sha }}
      languages: ${{ steps.analysis.outputs.languages }}
    steps:
      - name: Checkout trusted upload helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ts/tools/scripts/codeqlForkUpload.mjs
          sparse-checkout-cone-mode: false

      - name: Verify analysis metadata
        id: analysis
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { resolve } = require("node:path");
            const helper = await import(pathToFileURL(resolve("ts/tools/scripts/codeqlForkUpload.mjs")).href);
            const analysis = await helper.verifyForkAnalysis(github, context);
            core.setOutput("number", String(analysis.number));
            core.setOutput("sha", analysis.sha);
            core.setOutput("languages", JSON.stringify(analysis.languages));

  upload:
    name: Upload verified CodeQL results (${{ matrix.language }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.verify.outputs.languages) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout trusted upload helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ts/tools/scripts/codeqlForkUpload.mjs
          sparse-checkout-cone-mode: false

      - name: Download the verified language artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate report and analysis category
        id: report
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_SARIF_DIRECTORY: ${{ runner.temp }}/codeql-sarif
        run: node ts/tools/scripts/codeqlForkUpload.mjs

      - name: Upload CodeQL results to the pull request
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.report.outputs.sarif }}
          category: /language:${{ matrix.language }}
          ref: refs/pull/${{ needs.verify.outputs.number }}/head
          sha: ${{ needs.verify.outputs.sha }}
          wait-for-processing: true
